<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        select{
            margin-top: 10px;
            margin-bottom: 30px;
            padding: 5px;
            font-size: 16px;
           
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="black" style="color:white;">
    <!--img src=location of img-->
    <!--attributes are written with tags that define the properties of tag eg. height in img src-->
    <img src="https://plus.unsplash.com/premium_photo-1670275658563-450157cc6e34?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyMHx8fGVufDB8fHx8fA%3D%3D" height="500 px" style="border-style: inset;padding:20px;">
    <br>
    Which country is the view from?<br>
    <select>
        <option value="option1">Germany</option>
        <option value="option2">France</option>
        <option value="option3">Korea</option>
        <option selected disabled>Countries</option>
        <!---div /block tag takes 100% space of the webpg
        it is a container which stores a particuar block of code-->
    </select>
    <div style="background-color:beige;padding:20px;">
        <img src="https://images.pexels.com/photos/35554037/pexels-photo-35554037.jpeg" height="500px" style="border-style:inset;padding:10px;border-color:bisque" >
        <br>
        <b style="color:blue;">Which country is this view from?</b><br>
        <select label="Countries">
            <option value="option1">Italy</option>
            <option value="option2">Spain</option>
            <option value="option3">Norway</option>
            <option selected disabled>Countries</option>
        </select>
    </div>
</body>
</html>
